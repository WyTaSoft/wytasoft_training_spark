training_spark {
  debug {
    # When true, the driver sleeps after writing so the Spark UI can be browsed.
    enabled: false
    # How long to keep the Spark UI alive (milliseconds) when debug is enabled.
    ui_sleep_millis: 600000
  }

  inputs {

	  year_var: "2019"

      clients {
        dev: "localRun/data/clients/"
      }

      orders {
        dev: "localRun/data/orders/"
      }
    }

  outputs {
    clients_orders {
      dev: "localRun/data/clients_orders/"
    }
  }
  }