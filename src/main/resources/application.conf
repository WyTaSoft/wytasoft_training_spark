# =============================================================================
# WyTaSoft — Java Spark Training
# Application configuration (HOCON format — parsed by Typesafe Config)
# =============================================================================
# HOCON (Human-Optimized Config Object Notation) is a superset of JSON that
# supports comments, substitutions, and environment-specific overrides.
# ConfigFactory.load() reads this file automatically from the classpath.
# =============================================================================

training_spark {

  app_name: "training_spark_java"

  # ---------------------------------------------------------------------------
  # Data source paths — one entry per environment.
  # Use the env argument (args[0]) passed to MainDriver to pick the right path.
  # On a real cluster replace the "prod" values with HDFS URIs.
  # ---------------------------------------------------------------------------
  data {

    clients {
      dev:  "src/main/resources/data/clients/"
      test: "src/test/resources/data/clients/"
      prod: "hdfs:///data/training/clients/"
    }

    orders {
      dev:  "src/main/resources/data/orders/"
      test: "src/test/resources/data/orders/"
      prod: "hdfs:///data/training/orders/"
    }

    output {
      dev:  "src/main/resources/data/datalake/clients_orders/"
      test: "target/test-output/clients_orders/"
      prod: "hdfs:///datalake/clients_orders/"
    }
  }

  # ---------------------------------------------------------------------------
  # Writer settings — shared across all environments unless overridden.
  # ---------------------------------------------------------------------------
  writer {
    format:        "parquet"   # Output file format.
    partition_by:  "location"  # Column used to physically partition the output.
    num_partitions: 2          # Number of output files (coalesce target).
    mode:          "overwrite" # Save mode: overwrite | append.
  }

  # ---------------------------------------------------------------------------
  # Partition detection — column used to find the latest data folder.
  # ---------------------------------------------------------------------------
  partition {
    column: "date"             # Folder pattern: date=yyyy-MM-dd
  }
}
