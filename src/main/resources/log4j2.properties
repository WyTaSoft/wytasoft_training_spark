# =============================================================================
#  Log4j 2 configuration for the training_spark application (Spark 3.5 / Log4j 2.x).
#
#  Spark 3.5 ships Log4j 2 and auto-discovers this file on the classpath.
#  Logs go to the console and to a daily-rolling file under ${app.log.dir}.
#
#  The log directory defaults to "logs" (relative to the working directory) and
#  can be overridden at launch, e.g.:
#     spark-submit --conf "spark.driver.extraJavaOptions=-Dapp.log.dir=/var/log/training_spark" ...
#  It deliberately does NOT write under src/main/resources, so generated logs are
#  never copied onto the build classpath (which previously caused Windows file locks).
#
#  @author Mehdi TAJMOUATI
# =============================================================================

# Property holding the log output directory (override with -Dapp.log.dir=...).
property.logDir = ${sys:app.log.dir:-logs}
property.logPattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n%ex

# ---- Root logger -------------------------------------------------------------
rootLogger.level = info
rootLogger.appenderRef.stdout.ref = console
rootLogger.appenderRef.file.ref = rollingFile

# ---- Console appender --------------------------------------------------------
appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = ${logPattern}

# ---- Rolling file appender ---------------------------------------------------
appender.rolling.type = RollingFile
appender.rolling.name = rollingFile
appender.rolling.fileName = ${logDir}/app.log
appender.rolling.filePattern = ${logDir}/app-%d{yyyy-MM-dd}-%i.log.gz
appender.rolling.layout.type = PatternLayout
appender.rolling.layout.pattern = ${logPattern}
appender.rolling.policies.type = Policies
appender.rolling.policies.time.type = TimeBasedTriggeringPolicy
appender.rolling.policies.time.interval = 1
appender.rolling.policies.time.modulate = true
appender.rolling.policies.size.type = SizeBasedTriggeringPolicy
appender.rolling.policies.size.size = 50MB
appender.rolling.strategy.type = DefaultRolloverStrategy
appender.rolling.strategy.max = 10

# ---- Application logger (com.wts.kayan) --------------------------------------
logger.app.name = com.wts.kayan
logger.app.level = info
logger.app.additivity = true

# ---- Quiet down noisy third-party loggers (mirrors Spark 3.5 defaults) -------
logger.spark.name = org.apache.spark
logger.spark.level = warn

logger.sparkproject.name = org.sparkproject
logger.sparkproject.level = warn

logger.jetty.name = org.sparkproject.jetty
logger.jetty.level = warn

logger.hadoop.name = org.apache.hadoop
logger.hadoop.level = warn

logger.parquet.name = org.apache.parquet
logger.parquet.level = warn

logger.hive.name = org.apache.hadoop.hive
logger.hive.level = error

# Spark SQL adaptive/Hive metastore chatter
logger.metastore.name = org.apache.hadoop.hive.metastore
logger.metastore.level = error

# Settings to quiet down noisy console output for the Spark shell-like sessions.
logger.replexprTyper.name = org.apache.spark.repl.SparkIMain$exprTyper
logger.replexprTyper.level = info
logger.replSparkILoopInterpreter.name = org.apache.spark.repl.SparkILoop$SparkILoopInterpreter
logger.replSparkILoopInterpreter.level = info

# For deploying Spark ThriftServer
logger.thriftserver.name = org.apache.spark.sql.hive.thriftserver.SparkExecuteStatementOperation
logger.thriftserver.level = warn

# ---- Suppress known harmless warnings ---------------------------------------
# Parquet's "corrupt statistics" warning for files written by older Parquet.
logger.parquetOutputCommitter.name = org.apache.parquet.hadoop.ParquetOutputCommitter
logger.parquetOutputCommitter.level = error

# SPARK-9183: deny-listing of native libraries that aren't present.
logger.nativecodeloader.name = org.apache.hadoop.util.NativeCodeLoader
logger.nativecodeloader.level = error
