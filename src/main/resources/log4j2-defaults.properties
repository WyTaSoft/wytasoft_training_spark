# =============================================================================
# WyTaSoft — shadows org/apache/spark/log4j2-defaults.properties inside
# spark-core.jar.  Spark's Logging trait loads this resource via ClassLoader
# and calls ctx.reconfigure(), replacing whatever Log4j 2 had loaded before.
# By providing our own version here, the application classpath wins over the
# JAR, and we control the final configuration.
# =============================================================================

status = error

# ---------------------------------------------------------------------------
# Console appender — SYSTEM_OUT with our full ISO-8601 pattern.
# ---------------------------------------------------------------------------
appender.console.type   = Console
appender.console.name   = Console
appender.console.target = SYSTEM_OUT
appender.console.layout.type    = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%t] %logger{40} - %msg%n

# ---------------------------------------------------------------------------
# Application code — INFO so all training log statements are visible.
# ---------------------------------------------------------------------------
logger.wts.name                    = com.wts
logger.wts.level                   = info
logger.wts.additivity              = false
logger.wts.appenderRef.console.ref = Console

# ---------------------------------------------------------------------------
# Root — ERROR for everything else (Spark, Hadoop, Jetty, ZooKeeper …).
# ---------------------------------------------------------------------------
rootLogger.level                   = error
rootLogger.appenderRef.console.ref = Console
